<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Sonora - Radar de Navegación</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        #btnIniciar {
            background-color: #00e676;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }
        #estado {
            font-size: 22px;
            color: #ffeb3b;
            margin-top: 15px;
            font-weight: bold;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Guía Sonora</h1>
    <button id="btnIniciar">INICIAR RADAR</button>
    
    <video id="video" autoplay playsinline muted></video>
    <div id="estado">Cargando inteligencia artificial...</div>

    <script>
        let model = null;
        let video = document.getElementById('video');
        let estado = document.getElementById('estado');
        let btnIniciar = document.getElementById('btnIniciar');
        
        let audioCtx = null;
        let esActivo = false;
        let ultimoAvisoTiempo = 0;
        let ultimoTextoAvisado = "";

        function decirTexto(texto) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function emitirPitido(frecuencia, duracion) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frecuencia;
            gain.gain.value = 0.15;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (duracion / 1000));
        }

        function emitirPitidoCara() {
            emitirPitido(1400, 80);
            setTimeout(() => emitirPitido(1400, 80), 100);
            setTimeout(() => emitirPitido(1400, 80), 200);
        }

        async function cargarModelo() {
            estado.innerText = "Cargando modelo de IA...";
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            estado.innerText = "IA Lista. Pulsa Iniciar Radar.";
        }

        cargarModelo();

        async function IniciarCamara() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(true); };
                });
            } catch (err) {
                estado.innerText = "Error accediendo a la cámara.";
                decirTexto("Error al abrir la cámara.");
                return false;
            }
        }

        btnIniciar.addEventListener('click', async () => {
            if (!model) {
                decirTexto("El modelo aún se está cargando.");
                return;
            }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            btnIniciar.style.display = 'none';
            estado.innerText = "Iniciando cámara...";

            let camaraLista = await IniciarCamara();
            if (camaraLista) {
                esActivo = true;
                estado.innerText = "Radar Activo. Escaneando...";
                decirTexto("Radar activo. Detección de masa alta activada.");
                procesarRadarContinuo();
            }
        });

        async function procesarRadarContinuo() {
            if (!esActivo) return;

            let ahora = Date.now();
            let anchoVideo = video.videoWidth || 640;
            let altoVideo = video.videoHeight || 480;
            let areaPantalla = anchoVideo * altoVideo;

            let predicciones = await model.detect(video);
            let peligroCara = false;
            let obstaculoInminente = false;
            let avisoTexto = "";

            // Evaluar todas las detecciones e ignorar filtros de clase para la franja de la cabeza
            for (let p of predicciones) {
                let x = p.bbox[0];
                let y = p.bbox[1];
                let ancho = p.bbox[2];
                let alto = p.bbox[3];
                let areaObjeto = ancho * alto;
                let porcentajeOcupado = (areaObjeto / areaPantalla) * 100;

                let centroX = x + (ancho / 2);
                let centroY = y + (alto / 2);
                let sectorHorizontal = "";

                if (centroX < (anchoVideo * 0.30)) {
                    sectorHorizontal = "a la izquierda";
                } else if (centroX > (anchoVideo * 0.70)) {
                    sectorHorizontal = "a la derecha";
                } else {
                    sectorHorizontal = "al centro";
                }

                // CUALQUIER elemento detectado en la mitad superior de la pantalla sin importar su etiqueta
                if (centroY < (altoVideo * 0.60) && sectorHorizontal === "al centro") {
                    peligroCara = true;
                    avisoTexto = "Obstáculo a la altura de la cara";
                    break;
                }

                if (porcentajeOcupado > 30) {
                    obstaculoInminente = true;
                    avisoTexto = "Obstáculo " + sectorHorizontal;
                    break;
                }

                if (p.class === "person") {
                    avisoTexto = "Persona " + sectorHorizontal;
                    if (sectorHorizontal === "al centro") obstaculoInminente = true;
                    break;
                }
            }

            // Gestión de avisos
            if (ahora - ultimoAvisoTiempo > 1000) {
                if (peligroCara) {
                    emitirPitidoCara();
                    if (avisoTexto !== ultimoTextoAvisado) {
                        decirTexto("Peligro alto al centro");
                        ultimoTextoAvisado = avisoTexto;
                    }
                    estado.innerText = "¡ALERTA CABEZA!: Obstáculo detectado";
                    ultimoAvisoTiempo = ahora;
                } else if (avisoTexto !== "") {
                    if (obstaculoInminente) emitirPitido(900, 200);
                    if (avisoTexto !== ultimoTextoAvisado) {
                        decirTexto(avisoTexto);
                        ultimoTextoAvisado = avisoTexto;
                    }
                    estado.innerText = "Alerta: " + avisoTexto;
                    ultimoAvisoTiempo = ahora;
                } else {
                    ultimoTextoAvisado = "";
                    estado.innerText = "Vía libre";
                }
            }

            requestAnimationFrame(procesarRadarContinuo);
        }
    </script>
</body>
</html>
