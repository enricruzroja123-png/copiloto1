<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Robótico - Guía Sonora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        #btnIniciar {
            background-color: #00e676;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }
        #canvas {
            display: none;
        }
        #estado {
            font-size: 22px;
            color: #ffeb3b;
            margin-top: 15px;
            font-weight: bold;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Radar Robótico de Navegación</h1>
    <button id="btnIniciar">INICIAR SENSOR ROBÓTICO</button>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="estado">Sensor listo. Pulsa Iniciar.</div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let estado = document.getElementById('estado');
        let btnIniciar = document.getElementById('btnIniciar');
        
        let audioCtx = null;
        let esActivo = false;
        let ultimoAvisoTiempo = 0;
        let ultimoTextoAvisado = "";

        function decirTexto(texto) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.3;
            window.speechSynthesis.speak(utterance);
        }

        function emitirPitido(frecuencia, duracion) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frecuencia;
            gain.gain.value = 0.2;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (duracion / 1000));
        }

        function emitirPitidoCara() {
            emitirPitido(1400, 70);
            setTimeout(() => emitirPitido(1400, 70), 90);
            setTimeout(() => emitirPitido(1400, 70), 180);
        }

        async function IniciarCamara() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 320 }, height: { ideal: 240 } },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { 
                        canvas.width = 160;
                        canvas.height = 120;
                        resolve(true); 
                    };
                });
            } catch (err) {
                estado.innerText = "Error accediendo a la cámara.";
                decirTexto("Error de cámara.");
                return false;
            }
        }

        btnIniciar.addEventListener('click', async () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            btnIniciar.style.display = 'none';
            estado.innerText = "Iniciando sensores...";

            let camaraLista = await IniciarCamara();
            if (camaraLista) {
                esActivo = true;
                estado.innerText = "Sensor Robótico Activo";
                decirTexto("Sensor robótico listo.");
                procesarEscaneoRobotico();
            }
        });

        function procesarEscaneoRobotico() {
            if (!esActivo) return;

            let ahora = Date.now();
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let pixels = frame.data;

            // Matriz de ocupación por cuadrantes (Arriba, Izquierda, Centro, Derecha, Abajo)
            let densidad = { arriba: 0, izq: 0, centro: 0, der: 0, abajo: 0 };
            let totalPixels = pixels.length / 4;

            // Análisis de contraste y bordes de la toma
            for (let i = 0; i < pixels.length; i += 16) {
                let r = pixels[i];
                let g = pixels[i + 1];
                let b = pixels[i + 2];
                
                // Métrica de masa/brillo
                let brillo = (r + g + b) / 3;
                let pixelIndex = i / 4;
                let x = pixelIndex % canvas.width;
                let y = Math.floor(pixelIndex / canvas.width);

                if (brillo < 110) { // Detector de presencia física / obstáculo
                    if (y < canvas.height * 0.40 && x > canvas.width * 0.25 && x < canvas.width * 0.75) {
                        densidad.arriba++;
                    } else if (x < canvas.width * 0.30) {
                        densidad.izq++;
                    } else if (x > canvas.width * 0.70) {
                        densidad.der++;
                    } else if (y > canvas.height * 0.65) {
                        densidad.abajo++;
                    } else {
                        densidad.centro++;
                    }
                }
            }

            let avisoTexto = "";
            let tipoAlerta = "normal";

            // Prioridades de colisión robótica
            if (densidad.arriba > 350) {
                tipoAlerta = "cara";
                avisoTexto = "Cara centro";
            } else if (densidad.centro > 500) {
                avisoTexto = "Obstáculo centro";
            } else if (densidad.izq > 450) {
                avisoTexto = "Peligro izquierda";
            } else if (densidad.der > 450) {
                avisoTexto = "Peligro derecha";
            } else if (densidad.abajo > 600) {
                avisoTexto = "Suelo centro";
            }

            // Emisión sonora súper fluida
            if (ahora - ultimoAvisoTiempo > 750) {
                if (avisoTexto !== "") {
                    if (tipoAlerta === "cara") {
                        emitirPitidoCara();
                    } else {
                        emitirPitido(900, 120);
                    }

                    if (avisoTexto !== ultimoTextoAvisado) {
                        decirTexto(avisoTexto);
                        ultimoTextoAvisado = avisoTexto;
                    }
                    estado.innerText = "Alerta: " + avisoTexto;
                    ultimoAvisoTiempo = ahora;
                } else {
                    ultimoTextoAvisado = "";
                    estado.innerText = "Vía libre";
                }
            }

            requestAnimationFrame(procesarEscaneoRobotico);
        }
    </script>
</body>
</html>
