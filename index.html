<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Sonora - Radar de Navegación</title>
    <!-- Carga de TensorFlow.js y modelo COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #btnIniciar {
            background-color: #00e676;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        #btnIniciar:active {
            background-color: #00b0ff;
        }
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }
        #estado {
            font-size: 18px;
            color: #ffeb3b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Guía Sonora</h1>
    <button id="btnIniciar">INICIAR RADAR</button>
    <video id="video" autoplay playsinline muted></video>
    <div id="estado">Radar desactivado. Pulsa el botón.</div>

    <script>
        let model = null;
        let video = document.getElementById('video');
        let estado = document.getElementById('estado');
        let btnIniciar = document.getElementById('btnIniciar');
        
        let audioCtx = null;
        let esActivo = false;
        let ultimoAvisoTiempo = 0;

        // Inicializar síntesis de voz y audio
        function decirTexto(texto) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function emitirPitido(frecuencia, duracion) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frecuencia;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (duracion / 1000));
        }

        // Cargar Modelo COCO-SSD
        async function cargarModelo() {
            estado.innerText = "Cargando modelo de IA...";
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            estado.innerText = "IA Lista. Pulsa Iniciar Radar.";
        }

        cargarModelo();

        // Arrancar Cámara
        async function IniciarCamara() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(true); };
                });
            } catch (err) {
                estado.innerText = "Error accediendo a la cámara.";
                decirTexto("Error al abrir la cámara.");
                return false;
            }
        }

        // Evento de inicio (Toque único)
        btnIniciar.addEventListener('click', async () => {
            if (!model) {
                decirTexto("El modelo aún se está cargando. Espera unos segundos.");
                return;
            }

            btnIniciar.disabled = true;
            btnIniciar.style.display = 'none';
            estado.innerText = "Iniciando cámara...";

            let camaraLista = await IniciarCamara();
            if (camaraLista) {
                esActivo = true;
                estado.innerText = "Radar Activo Continuo.";
                decirTexto("Radar activo. Navegación continua iniciada.");
                procesarRadarContinuo();
            }
        });

        // Bucle Continuo de Detección
        async function procesarRadarContinuo() {
            if (!esActivo) return;

            let ahora = Date.now();
            let anchoVideo = video.videoWidth || 640;
            let altoVideo = video.videoHeight || 480;
            let areaPantalla = anchoVideo * altoVideo;

            let predicciones = await model.detect(video);

            let obstaculoInminente = false;
            let avisoTexto = "";

            for (let p of predicciones) {
                let x = p.bbox[0];
                let y = p.bbox[1];
                let ancho = p.bbox[2];
                let alto = p.bbox[3];
                let areaObjeto = ancho * alto;
                let porcentajeOcupado = (areaObjeto / areaPantalla) * 100;

                let centroX = x + (ancho / 2);
                let sector = "";

                // Calculo estricto de sectores en tercios (33% | 34% | 33%)
                if (centroX < (anchoVideo * 0.33)) {
                    sector = "a la izquierda";
                } else if (centroX > (anchoVideo * 0.66)) {
                    sector = "a la derecha";
                } else {
                    sector = "al centro";
                }

                // 1. Filtro de Masa Frontal (Sofá/Pared/Bulto cercano no identificado)
                if (porcentajeOcupado > 55) {
                    obstaculoInminente = true;
                    avisoTexto = "Obstáculo grande " + sector;
                    break;
                }

                // 2. Detección de Peatones o Vehículos con filtro de confianza
                if (p.score > 0.45) {
                    if (p.class === "person") {
                        // Evitar que te detecte las manos/brazos muy cerca como peatón completo
                        if (porcentajeOcupado < 80) {
                            avisoTexto = "Peatón " + sector;
                            if (sector === "al centro") obstaculoInminente = true;
                        }
                    } else if (["chair", "couch", "table", "bed"].includes(p.class)) {
                        if (porcentajeOcupado > 25) {
                            avisoTexto = "Mueble " + sector;
                            if (sector === "al centro") obstaculoInminente = true;
                        }
                    } else if (["car", "bicycle", "bus", "truck"].includes(p.class)) {
                        avisoTexto = "Vehículo " + sector;
                        if (sector === "al centro") obstaculoInminente = true;
                    }
                }
            }

            // Gestionar Avisos y Tiempos
            if (ahora - ultimoAvisoTiempo > 1200) { // Avisos cada 1.2 segundos
                if (obstaculoInminente) {
                    emitirPitido(880, 200); // Pitido agudo de alerta
                    if (avisoTexto) decirTexto(avisoTexto);
                    ultimoAvisoTiempo = ahora;
                } else if (avisoTexto) {
                    decirTexto(avisoTexto);
                    ultimoAvisoTiempo = ahora;
                }
            }

            // Bucle sin fin para mantener la cámara procesando continuamente
            requestAnimationFrame(procesarRadarContinuo);
        }
    </script>
</body>
</html>
