<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto Uno</title>
    <!-- Cargamos el cerebro de la IA de Google para web -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #00e676; }
        #video-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #00e676; }
        video { width: 100%; height: auto; display: block; }
        .btn { background-color: #00e676; color: #000; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; margin-top: 20px; cursor: pointer; border: none; }
        #status { margin-top: 15px; font-size: 16px; color: #ffeb3b; }
    </style>
</head>
<body>

    <h1>COPILOTO UNO</h1>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button class="btn" onclick="iniciarCopiloto()">ACTIVAR COPILOTO</button>
    <div id="status">Presiona para activar...</div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        let modeloIA = null;
        let detectando = false;
        let ultimoAviso = 0;

        // Diccionario para traducir objetos al español
        const traducciones = {
            "person": "persona", "bicycle": "bicicleta", "car": "coche", "motorcycle": "moto",
            "bus": "autobús", "truck": "camión", "traffic light": "semáforo", "stop sign": "señal",
            "bench": "banco", "chair": "silla", "couch": "sofá", "bed": "cama", "dining table": "mesa"
        };

        async function iniciarCopiloto() {
            statusDiv.innerText = "1/2 Iniciando cámara...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                
                video.srcObject = stream;

                // Esperar a que el video esté listo antes de cargar la IA
                video.onloadeddata = async () => {
                    statusDiv.innerText = "2/2 Cargando cerebro IA... (puede tardar unos segundos)";
                    modeloIA = await cocoSsd.load();
                    statusDiv.innerText = "¡Copiloto Activo! Escaneando entorno...";
                    hablar("Copiloto uno activado. Escaneando.");
                    detectando = true;
                    escanearFotograma();
                };
            } catch (err) {
                statusDiv.innerText = "Error de cámara: " + err.message;
            }
        }

        async function escanearFotograma() {
            if (!detectando) return;
            
            // Detectar objetos en el fotograma actual de la cámara
            const predicciones = await modeloIA.detect(video);
            
            const tiempoActual = Date.now();
            // Solo avisar cada 3.5 segundos para no saturar con la voz
            if (predicciones.length > 0 && tiempoActual - ultimoAviso > 3500) {
                // Coger el objeto más grande/seguro detectado
                const objeto = predicciones[0]; 
                
                if (objeto.score > 0.5 && traducciones[objeto.class]) {
                    const nombreEspañol = traducciones[objeto.class];
                    
                    // Calcular posición (izquierda, centro, derecha)
                    const centroX = objeto.bbox[0] + (objeto.bbox[2] / 2);
                    const anchoVideo = video.videoWidth;
                    let posicion = "al frente";
                    
                    if (centroX < anchoVideo * 0.33) posicion = "a la izquierda";
                    else if (centroX > anchoVideo * 0.66) posicion = "a la derecha";

                    hablar(`${nombreEspañol} ${posicion}`);
                    ultimoAviso = tiempoActual;
                }
            }
            
            // Repetir el bucle de escaneo de forma continua
            requestAnimationFrame(escanearFotograma);
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.rate = 1.0;
                window.speechSynthesis.speak(mensaje);
            }
        }
    </script>
</body>
</html>
