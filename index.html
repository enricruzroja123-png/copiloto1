<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto de Ruta AI</title>
    <!-- Carga del motor de Inteligencia Artificial para la cámara -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin: 10px 0; text-align: center; color: #4fc3f7; }
        .camara-box {
            width: 100%;
            max-width: 360px;
            height: 240px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333333;
            position: relative;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .panel-botones {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            color: #ffffff;
        }
        .btn-cam { background-color: #2e7d32; }
        .btn-mic { background-color: #0288d1; }
        #estado { margin-top: 15px; font-size: 1.1rem; color: #ffca28; text-align: center; }
        #registro { margin-top: 8px; font-size: 0.95rem; color: #b0bec5; text-align: center; }
    </style>
</head>
<body>

    <h1>Copiloto de Ruta AI</h1>

    <div class="camara-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="panel-botones">
        <button class="btn btn-cam" onclick="iniciarDeteccion()">📷 Iniciar Vision y Distancias</button>
        <button class="btn btn-mic" onclick="activarMicrofono()">🎙️ Activar Voz / DBR</button>
    </div>

    <div id="estado">Presiona "Iniciar Vision" para cargar el detector</div>
    <div id="registro">Esperando ordenes...</div>

    <script>
        const estado = document.getElementById('estado');
        const registro = document.getElementById('registro');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let modeloAI = null;
        let ultimaAlerta = 0;

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                window.speechSynthesis.speak(mensaje);
            }
        }

        async function iniciarDeteccion() {
            estado.innerText = 'Cargando motor de vision...';
            try {
                // Iniciar la cámara trasera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;

                // Cargar modelo de detección de objetos
                modeloAI = await cocoSsd.load();
                estado.innerText = 'Vision y detector de peligro activos';
                hablar('Sistema de vision y distancias activado.');

                // Ajustar resolución del canvas
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    detectarObjetos();
                };
            } catch (err) {
                estado.innerText = 'Error al acceder a la camara o cargar el detector';
            }
        }

        async function detectarObjetos() {
            if (!modeloAI) return;

            const predicciones = await modeloAI.detect(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const tiempoActual = Date.now();

            predicciones.forEach(pred => {
                // Dibujar caja sobre el objeto detectado
                const [x, y, width, height] = pred.bbox;
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);

                // Estimación de proximidad según el alto de la caja retenida en pantalla
                const proporcionPantalla = height / canvas.height;
                let distanciaTexto = 'Lejos';

                if (proporcionPantalla > 0.5) {
                    distanciaTexto = 'Muy cerca (Peligro)';
                    ctx.strokeStyle = '#FF0000'; // Caja roja para peligro
                } else if (proporcionPantalla > 0.25) {
                    distanciaTexto = 'Distancia media';
                }

                ctx.fillStyle = '#00FF00';
                ctx.font = '18px Arial';
                ctx.fillText(`${pred.class} - ${distanciaTexto}`, x, y > 20 ? y - 5 : 20);

                // Alerta hablada si un obstáculo clave está peligroso
                if ((pred.class === 'person' || pred.class === 'car' || pred.class === 'dog' || pred.class === 'cat') && proporcionPantalla > 0.5) {
                    if (tiempoActual - ultimaAlerta > 5000) { // Alerta cada 5 segundos para no saturar
                        hablar(`Atención, ${traducirClase(pred.class)} muy cerca.`);
                        ultimaAlerta = tiempoActual;
                    }
                }
            });

            requestAnimationFrame(detectarObjetos);
        }

        function traducirClase(clase) {
            switch(clase) {
                case 'person': return 'persona';
                case 'car': return 'vehículo';
                case 'dog': return 'perro';
                case 'cat': return 'animal';
                default: return 'obstáculo';
            }
        }

        function activarMicrofono() {
            if (!Recognition) {
                estado.innerText = 'Navegador sin soporte de voz';
                return;
            }

            const recon = new Recognition();
            recon.lang = 'es-ES';

            recon.onstart = function() {
                estado.innerText = 'Escuchando orden...';
            };

            recon.onresult = function(event) {
                const comando = event.results[0][0].transcript.toLowerCase();
                registro.innerText = 'Orden: ' + comando;

                if (comando.includes('dbr') || comando.includes('tramite')) {
                    hablar('Evento DBR registrado en ruta.');
                } else {
                    hablar('Comando recibido: ' + comando);
                }
                estado.innerText = 'Copiloto listo';
            };

            recon.start();
        }
    </script>

</body>
</html>
