<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Sonora de Ruta</title>
    <!-- Carga del motor de IA -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        /* Diseño visual mínimo y oscuro para no molestar */
        body {
            font-family: sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; margin-bottom: 30px; }
        
        /* Ocultamos la cámara visual, solo necesitamos el procesado */
        #video, #canvas { display: none; }

        .btn {
            border: none;
            padding: 25px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            color: #ffffff;
            width: 100%;
            max-width: 340px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }
        .btn-activar { background-color: #16a34a; } /* Verde para iniciar */
        .btn-dbr { background-color: #0284c7; } /* Azul para DBR */
        
        #estado { margin-top: 20px; font-size: 1.1rem; color: #fbbf24; text-align: center; }
    </style>
</head>
<body>

    <h1>🐾 Guía Sonora de Ruta</h1>

    <!-- Elementos ocultos para el procesado de imagen -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <button class="btn btn-activar" onclick="iniciarGuiaSonora()">📷 INICIAR GUÍA SONORA</button>
    <button class="btn btn-dbr" onclick="activarMicrofonoDBR()">🎙️ REGISTRO DBR (Voz)</button>

    <div id="estado">Pulsa "INICIAR" para activar el radar</div>

    <script>
        const estado = document.getElementById('estado');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let modeloAI = null;
        let estaHablando = false;
        let ultimoAvisoT = 0;
        let contextAudio = null;
        let oscilador = null;

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // --- SISTEMA SONORO (Sustituye a los colores) ---
        
        // Inicializar sonido
        function initAudio() {
            if (!contextAudio) {
                contextAudio = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Tocar pitido de alerta (Urgencia)
        function tocarPitido(frecuencia, duracion, repeticiones) {
            initAudio();
            if (oscilador) oscilador.stop();

            oscilador = contextAudio.createOscillator();
            const gainNode = contextAudio.createGain();

            oscilador.connect(gainNode);
            gainNode.connect(contextAudio.destination);

            oscilador.type = 'sine'; // Tono suave
            oscilador.frequency.value = frecuencia; // Frecuencia del pitido
            gainNode.gain.value = 0.1; // Volumen bajo

            oscilador.start();
            
            // Ciclo de pitidos para urgencia
            let count = 0;
            const interval = setInterval(() => {
                gainNode.gain.value = 0.1; // Sonar
                setTimeout(() => { gainNode.gain.value = 0; }, duracion / 2); // Callar
                count++;
                if (count >= repeticiones) {
                    clearInterval(interval);
                    setTimeout(() => oscilador.stop(), duracion);
                }
            }, duracion);
        }

        function hablar(texto) {
            const ahora = Date.now();
            // Freno de voz: 3.5 segundos entre avisos
            if ('speechSynthesis' in window && !estaHablando && (ahora - ultimoAvisoT > 3500)) {
                estaHablando = true;
                ultimoAvisoT = ahora;
                window.speechSynthesis.cancel();
                
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.onend = () => { estaHablando = false; };
                
                window.speechSynthesis.speak(mensaje);
            }
        }

        // --- INICIAR GUÍA ---
        async function iniciarGuiaSonora() {
            estado.innerText = "Activando radar sonoro...";
            initAudio(); // Activar audio en el primer clic
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;

                modeloAI = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                
                estado.innerText = "Radar activo (Escuchando ruta)";
                hablar("Guía sonora activada. Radar de ruta encendido.");

                video.onloadedmetadata = () => {
                    // El canvas se usa internamente para calcular sectores, no para mostrar
                    canvas.width = 360; 
                    canvas.height = 270;
                    procesarRadarSonoro();
                };
            } catch (err) {
                estado.innerText = "Error de cámara o permisos";
                hablar("Error al activar el radar.");
            }
        }

        async function procesarRadarSonoro() {
            if (modeloAI && video.readyState === 4) {
                const predicciones = await modeloAI.detect(video);
                
                let peligroDetectado = false;
                let objetoPeligroso = "";
                let sectorPeligroso = "";
                let distanciaMinima = 99;

                predicciones.forEach(pred => {
                    if (pred.score > 0.5) {
                        const [x, y, width, height] = pred.bbox;
                        
                        // Procesado interno de sectores (IZQ | CENTRO | DER)
                        const tercioW = video.videoWidth / 3;
                        const centroX = x + (width / 2);
                        let sector = "centro";
                        if (centroX < tercioW) sector = "izquierda";
                        else if (centroX > tercioW * 2) sector = "derecha";

                        // Estimación rápida de distancia (2m - 15m)
                        const metros = Math.max(2, Math.round(15 * (1 - (height / video.videoHeight))));

                        // Lógica de alerta por sonido
                        if (metros <= 8) {
                            peligroDetectado = true;
                            if (metros < distanciaMinima) {
                                distanciaMinima = metros;
                                objetoPeligroso = traducir(pred.class);
                                sectorPeligroso = sector;
                            }
                        }
                    }
                });

                // --- EMITIR ALERTAS SONORAS ---
                if (peligroDetectado) {
                    // 1. Alerta por Tono (Urgencia)
                    if (distanciaMinima <= 4) {
                        // Peligro Cerca: Pitido rápido y agudo
                        tocarPitido(800, 150, 3); 
                    } else {
                        // Distancia Media: Pitido lento y grave
                        tocarPitido(400, 400, 1);
                    }

                    // 2. Alerta por Voz (Ubicación)
                    hablar(`${objetoPeligroso}, ${sectorPeligroso}.`);
                }
            }
            // Escaneo constante
            setTimeout(() => { requestAnimationFrame(procesarRadarSonoro); }, 200);
        }

        function traducir(clase) {
            switch(clase) {
                case 'person': return 'Peatón';
                case 'car': return 'Coche';
                case 'dog': return 'Perro';
                case 'cat': return 'Animal';
                default: return 'Obstáculo';
            }
        }

        // --- REGISTRO DBR (VOZ) ---
        function activarMicrofonoDBR() {
            if (!Recognition) return;
            hablar("Diga el evento para guardar en DBR.");
            const recon = new Recognition();
            recon.lang = 'es-ES';
            recon.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                if (cmd.includes('dbr') || cmd.includes('registro')) {
                    hablar("Trámite DBR registrado.");
                } else {
                    hablar("Registro guardado: " + cmd);
                }
            };
            recon.start();
        }
    </script>

</body>
</html>
