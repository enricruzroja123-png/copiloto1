<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto Uno - Control FPS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #00e676; font-size: 22px; margin-bottom: 5px; }
        #video-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #00e676; }
        video { width: 100%; height: auto; display: block; }
        .btn { background-color: #00e676; color: #000; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; margin-top: 15px; cursor: pointer; border: none; width: 100%; max-width: 300px; }
        #status { margin-top: 12px; font-size: 15px; color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

    <h1>COPILOTO UNO</h1>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button class="btn" onclick="iniciarCopiloto()">ACTIVAR DETECCIÓN</button>
    <div id="status">Presiona para activar...</div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        let modeloIA = null;
        let detectando = false;
        let ultimoAviso = 0;
        let ultimoEscaneoFPS = 0;
        const FPS_OBJETIVO = 8; // Analizar únicamente 8 fotogramas por segundo para evitar fantasmas
        const INTERVALO_FPS = 1000 / FPS_OBJETIVO;

        const traducciones = {
            "person": "Persona", "bicycle": "Bicicleta", "car": "Coche", "motorcycle": "Moto",
            "bus": "Autobús", "truck": "Camión", "traffic light": "Semáforo", "stop sign": "Señal",
            "bench": "Banco", "chair": "Silla", "couch": "Sofá", "bed": "Cama", "dining table": "Mesa",
            "potted plant": "Maceta", "door": "Puerta"
        };

        async function iniciarCopiloto() {
            statusDiv.innerText = "Iniciando cámara...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                
                video.srcObject = stream;

                video.onloadeddata = async () => {
                    statusDiv.innerText = "Cargando motor de visión...";
                    modeloIA = await cocoSsd.load({ base: 'mobilenet_v2' });
                    statusDiv.innerText = "¡Copiloto Activo!";
                    hablar("Copiloto activo.");
                    detectando = true;
                    requestAnimationFrame(escanearConFPS);
                };
            } catch (err) {
                statusDiv.innerText = "Error de cámara: " + err.message;
            }
        }

        async function escanearConFPS(tiempoActual) {
            if (!detectando) return;

            // Control estricto de marcos por segundo (FPS)
            if (tiempoActual - ultimoEscaneoFPS >= INTERVALO_FPS) {
                ultimoEscaneoFPS = tiempoActual;

                const predicciones = await modeloIA.detect(video, 5, 0.35);

                if (predicciones.length > 0 && tiempoActual - ultimoAviso > 3000) {
                    let objetoPrincipal = predicciones[0];
                    let maxArea = 0;

                    for (let p of predicciones) {
                        let area = p.bbox[2] * p.bbox[3];
                        if (area > maxArea) {
                            maxArea = area;
                            objetoPrincipal = p;
                        }
                    }

                    if (traducciones[objetoPrincipal.class]) {
                        const nombre = traducciones[objetoPrincipal.class];
                        const [x, y, ancho, alto] = objetoPrincipal.bbox;
                        
                        const centroX = x + (ancho / 2);
                        const centroY = y + (alto / 2);
                        
                        const anchoTotal = video.videoWidth || 640;
                        const altoTotal = video.videoHeight || 480;

                        // Posición Lateral
                        let posLat = "al frente";
                        if (centroX < anchoTotal * 0.35) posLat = "a la izquierda";
                        else if (centroX > anchoTotal * 0.65) posLat = "a la derecha";

                        // Altura
                        let posAlt = "";
                        if (centroY < altoTotal * 0.33) posAlt = "arriba";
                        else if (centroY > altoTotal * 0.66) posAlt = "abajo";

                        let mensaje = `${nombre} ${posLat} ${posAlt}`.trim();
                        statusDiv.innerText = "Detectado: " + mensaje;
                        hablar(mensaje);
                        ultimoAviso = tiempoActual;
                    }
                }
            }
            
            requestAnimationFrame(escanearConFPS);
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.rate = 1.0;
                window.speechSynthesis.speak(mensaje);
            }
        }
    </script>
</body>
</html>
