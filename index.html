<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Sonora - Radar de Navegación</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        #btnIniciar {
            background-color: #00e676;
            color: #000;
            font-size: 22px;
            font-weight: bold;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 90%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .contenedor-camara {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        #video, #canvas {
            width: 100%;
            border-radius: 8px;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #estado {
            font-size: 18px;
            color: #ffeb3b;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Guía Sonora</h1>
    <button id="btnIniciar">INICIAR RADAR</button>
    
    <div class="contenedor-camara">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="estado">Cargando inteligencia artificial...</div>

    <script>
        let model = null;
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let estado = document.getElementById('estado');
        let btnIniciar = document.getElementById('btnIniciar');
        
        let audioCtx = null;
        let esActivo = false;
        let ultimoAvisoTiempo = 0;

        function decirTexto(texto) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function emitirPitido(frecuencia, duracion) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frecuencia;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (duracion / 1000));
        }

        async function cargarModelo() {
            estado.innerText = "Cargando modelo de IA...";
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            estado.innerText = "IA Lista. Pulsa Iniciar Radar.";
        }

        cargarModelo();

        async function IniciarCamara() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(true);
                    };
                });
            } catch (err) {
                estado.innerText = "Error accediendo a la cámara.";
                decirTexto("Error al abrir la cámara.");
                return false;
            }
        }

        btnIniciar.addEventListener('click', async () => {
            if (!model) {
                decirTexto("El modelo aún se está cargando.");
                return;
            }

            // Desbloquear audio en el navegador
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            btnIniciar.style.display = 'none';
            estado.innerText = "Iniciando cámara...";

            let camaraLista = await IniciarCamara();
            if (camaraLista) {
                esActivo = true;
                estado.innerText = "Radar Activo. Escaneando...";
                decirTexto("Radar activo.");
                procesarRadarContinuo();
            }
        });

        async function procesarRadarContinuo() {
            if (!esActivo) return;

            let ahora = Date.now();
            let anchoVideo = video.videoWidth || 640;
            let altoVideo = video.videoHeight || 480;
            let areaPantalla = anchoVideo * altoVideo;

            // Limpiar lienzo de dibujo
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let predicciones = await model.detect(video);
            let obstaculoInminente = false;
            let avisoTexto = "";

            for (let p of predicciones) {
                let x = p.bbox[0];
                let y = p.bbox[1];
                let ancho = p.bbox[2];
                let alto = p.bbox[3];
                let areaObjeto = ancho * alto;
                let porcentajeOcupado = (areaObjeto / areaPantalla) * 100;

                let centroX = x + (ancho / 2);
                let sector = "";

                if (centroX < (anchoVideo * 0.33)) {
                    sector = "a la izquierda";
                } else if (centroX > (anchoVideo * 0.66)) {
                    sector = "a la derecha";
                } else {
                    sector = "al centro";
                }

                // Dibujar marco visual en la pantalla
                ctx.strokeStyle = "#00e676";
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, ancho, alto);

                ctx.fillStyle = "#00e676";
                ctx.font = "18px Arial";
                ctx.fillText(`${p.class} (${Math.round(p.score * 100)}%)`, x, y > 20 ? y - 5 : 20);

                // Detección de masa o categoría
                if (porcentajeOcupado > 50) {
                    obstaculoInminente = true;
                    avisoTexto = "Obstáculo grande " + sector;
                } else if (p.score > 0.40) {
                    if (p.class === "person") {
                        avisoTexto = "Peatón " + sector;
                        if (sector === "al centro") obstaculoInminente = true;
                    } else if (["chair", "couch", "table", "bed"].includes(p.class)) {
                        avisoTexto = "Mueble " + sector;
                        if (sector === "al centro") obstaculoInminente = true;
                    } else if (["car", "bicycle", "bus", "truck"].includes(p.class)) {
                        avisoTexto = "Vehículo " + sector;
                        if (sector === "al centro") obstaculoInminente = true;
                    }
                }
            }

            // Avisos por voz y sonido
            if (ahora - ultimoAvisoTiempo > 1400) {
                if (obstaculoInminente) {
                    emitirPitido(880, 250);
                    if (avisoTexto) decirTexto(avisoTexto);
                    estado.innerText = "¡ALERTA!: " + avisoTexto;
                    ultimoAvisoTiempo = ahora;
                } else if (avisoTexto) {
                    decirTexto(avisoTexto);
                    estado.innerText = "Detectado: " + avisoTexto;
                    ultimoAvisoTiempo = ahora;
                }
            }

            requestAnimationFrame(procesarRadarContinuo);
        }
    </script>
</body>
</html>
