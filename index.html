<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Robótico - Guía Sonora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        #btnIniciar {
            background-color: #00e676;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }
        #canvas {
            display: none;
        }
        #estado {
            font-size: 22px;
            color: #ffeb3b;
            margin-top: 15px;
            font-weight: bold;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Radar Robótico de Navegación</h1>
    <button id="btnIniciar">INICIAR SENSOR ROBÓTICO</button>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="estado">Sensor listo. Pulsa Iniciar.</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const estado = document.getElementById('estado');
        const btnIniciar = document.getElementById('btnIniciar');
        
        let audioCtx = null;
        let esActivo = false;
        let ultimoProcesadoTiempo = 0;
        let ultimoAvisoTiempo = 0;
        let ultimoTextoAvisado = "";
        
        // Control del bucle (FPS)
        const FPS_OBJETIVO = 12; // 12 fotogramas por segundo es óptimo y no satura la CPU
        const INTERVALO_MS = 1000 / FPS_OBJETIVO;

        function decirTexto(texto) {
            if ('speechSynthesis' in window) {
                // Evita cancelar si es exactamente el mismo texto hablando
                if (window.speechSynthesis.speaking && texto === ultimoTextoAvisado) return;
                
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function emitirPitido(frecuencia, duracion) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + (duracion / 1000));
            } catch (e) {
                console.error("Error reproduciendo audio:", e);
            }
        }

        function emitirPitidoCara() {
            emitirPitido(1400, 70);
            setTimeout(() => emitirPitido(1400, 70), 90);
        }

        async function IniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 320 }, height: { ideal: 240 } },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { 
                        canvas.width = 160;
                        canvas.height = 120;
                        resolve(true); 
                    };
                });
            } catch (err) {
                estado.innerText = "Error accediendo a la cámara.";
                decirTexto("Error de cámara.");
                return false;
            }
        }

        btnIniciar.addEventListener('click', async () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            btnIniciar.style.display = 'none';
            estado.innerText = "Iniciando sensores...";

            const camaraLista = await IniciarCamara();
            if (camaraLista) {
                esActivo = true;
                estado.innerText = "Sensor Robótico Activo";
                decirTexto("Sensor robótico listo.");
                requestAnimationFrame(procesarEscaneoRobotico);
            }
        });

        function procesarEscaneoRobotico(timestamp) {
            if (!esActivo) return;

            // Control de tiempo para limitar la ejecución a 12 FPS
            if (timestamp - ultimoProcesadoTiempo < INTERVALO_MS) {
                requestAnimationFrame(procesarEscaneoRobotico);
                return;
            }
            ultimoProcesadoTiempo = timestamp;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = frame.data;

            // Cuadrantes de densidad
            const densidad = { arriba: 0, izq: 0, centro: 0, der: 0, abajo: 0 };

            // Salto de 16 en 16 bytes (cada 4 píxeles) para aligerar la carga
            for (let i = 0; i < pixels.length; i += 16) {
                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                
                const brillo = (r + g + b) / 3;
                const pixelIndex = i / 4;
                const x = pixelIndex % canvas.width;
                const y = Math.floor(pixelIndex / canvas.width);

                if (brillo < 90) { // Umbral ajustado para reducir falsos positivos
                    if (y < canvas.height * 0.40 && x > canvas.width * 0.25 && x < canvas.width * 0.75) {
                        densidad.arriba++;
                    } else if (x < canvas.width * 0.30) {
                        densidad.izq++;
                    } else if (x > canvas.width * 0.70) {
                        densidad.der++;
                    } else if (y > canvas.height * 0.65) {
                        densidad.abajo++;
                    } else {
                        densidad.centro++;
                    }
                }
            }

            let avisoTexto = "";
            let tipoAlerta = "normal";

            // Umbrales de evaluación
            if (densidad.arriba > 250) {
                tipoAlerta = "cara";
                avisoTexto = "Cara centro";
            } else if (densidad.centro > 350) {
                avisoTexto = "Obstáculo centro";
            } else if (densidad.izq > 300) {
                avisoTexto = "Peligro izquierda";
            } else if (densidad.der > 300) {
                avisoTexto = "Peligro derecha";
            } else if (densidad.abajo > 400) {
                avisoTexto = "Suelo centro";
            }

            // Gestión de avisos sonoros (cada 900 ms como máximo)
            const ahora = Date.now();
            if (ahora - ultimoAvisoTiempo > 900) {
                if (avisoTexto !== "") {
                    if (tipoAlerta === "cara") {
                        emitirPitidoCara();
                    } else {
                        emitirPitido(900, 100);
                    }

                    if (avisoTexto !== ultimoTextoAvisado) {
                        decirTexto(avisoTexto);
                        ultimoTextoAvisado = avisoTexto;
                    }
                    estado.innerText = "Alerta: " + avisoTexto;
                    ultimoAvisoTiempo = ahora;
                } else {
                    ultimoTextoAvisado = "";
                    estado.innerText = "Vía libre";
                }
            }

            requestAnimationFrame(procesarEscaneoRobotico);
        }
    </script>
</body>
</html>
