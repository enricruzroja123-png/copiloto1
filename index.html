<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto de Ruta AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin: 10px 0; text-align: center; color: #4fc3f7; }
        .camara-container {
            width: 100%;
            max-width: 360px;
            height: 250px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #333;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas { z-index: 10; }
        .panel-botones {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            color: #ffffff;
        }
        .btn-cam { background-color: #2e7d32; }
        .btn-mic { background-color: #0288d1; }
        #estado { margin-top: 15px; font-size: 1.1rem; color: #ffca28; text-align: center; }
        #registro { margin-top: 8px; font-size: 0.95rem; color: #b0bec5; text-align: center; }
    </style>
</head>
<body>

    <h1>Copiloto de Ruta AI</h1>

    <div class="camara-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="panel-botones">
        <button class="btn btn-cam" onclick="iniciarCamarayAI()">📷 Activar Visión de Ruta</button>
        <button class="btn btn-mic" onclick="activarMicrofono()">🎙️ Orden por Voz / DBR</button>
    </div>

    <div id="estado">Pulsa "Activar Visión" para iniciar</div>
    <div id="registro">Esperando...</div>

    <script>
        const estado = document.getElementById('estado');
        const registro = document.getElementById('registro');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let modeloAI = null;
        let estaHablando = false;
        let ultimoTiempoAviso = 0;

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function hablarUnaVez(texto) {
            const ahora = Date.now();
            // Freno de voz: Solo habla si han pasado más de 4 segundos del último aviso y no está hablando
            if ('speechSynthesis' in window && !estaHablando && (ahora - ultimoTiempoAviso > 4000)) {
                estaHablando = true;
                ultimoTiempoAviso = ahora;
                window.speechSynthesis.cancel();
                
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                
                mensaje.onend = () => { estaHablando = false; };
                mensaje.onerror = () => { estaHablando = false; };
                
                window.speechSynthesis.speak(mensaje);
            }
        }

        async function iniciarCamarayAI() {
            estado.innerText = "Cargando motor de visión...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;

                // Cargar modelo optimizado (Lite)
                modeloAI = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                
                estado.innerText = "Visión activa y buscando objetos";
                hablarUnaVez("Sistema de visión activado.");

                video.onloadedmetadata = () => {
                    canvas.width = video.clientWidth;
                    canvas.height = video.clientHeight;
                    procesarLienzo();
                };
            } catch (err) {
                estado.innerText = "Error en cámara o permisos";
            }
        }

        async function procesarLienzo() {
            if (modeloAI && video.readyState === 4) {
                const predicciones = await modeloAI.detect(video);
                
                // Limpiar lienzo
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                predicciones.forEach(pred => {
                    if (pred.score > 0.5) { // Solo si tiene más del 50% de certeza
                        const [x, y, width, height] = pred.bbox;
                        
                        // Escalar dimensiones al lienzo del móvil
                        const scaleX = canvas.width / video.videoWidth;
                        const scaleY = canvas.height / video.videoHeight;

                        const boxX = x * scaleX;
                        const boxY = y * scaleY;
                        const boxW = width * scaleX;
                        const boxH = height * scaleY;

                        // Dibujar cuadro verde
                        ctx.strokeStyle = "#00FF00";
                        ctx.lineWidth = 4;
                        ctx.strokeRect(boxX, boxY, boxW, boxH);

                        // Etiqueta de texto
                        ctx.fillStyle = "#00FF00";
                        ctx.font = "bold 16px Arial";
                        ctx.fillText(pred.class, boxX, boxY > 20 ? boxY - 5 : 20);

                        // Alerta si ocupa bastante espacio en pantalla
                        if (boxH > canvas.height * 0.4) {
                            if (pred.class === 'person') hablarUnaVez("Peatón cerca.");
                            else if (pred.class === 'car') hablarUnaVez("Vehículo cerca.");
                            else if (pred.class === 'dog' || pred.class === 'cat') hablarUnaVez("Animal cerca.");
                        }
                    }
                });
            }
            // Ejecutar escaneo suave
            setTimeout(() => { requestAnimationFrame(procesarLienzo); }, 150);
        }

        function activarMicrofono() {
            if (!Recognition) return;
            const recon = new Recognition();
            recon.lang = 'es-ES';
            recon.onstart = () => { estado.innerText = "Escuchando orden..."; };
            recon.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                registro.innerText = 'Orden: "' + cmd + '"';
                if (cmd.includes('dbr')) hablarUnaVez("Registro DBR guardado.");
                else hablarUnaVez("Comando: " + cmd);
            };
            recon.start();
        }
    </script>

</body>
</html>
