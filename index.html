<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto Uno - Detección ONNX</title>
  <!-- ONNX Runtime Web CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 15px;
      text-align: center;
      background-color: #1f1f1f;
      width: 100%;
    }
    #container {
      position: relative;
      margin-top: 10px;
    }
    video, canvas {
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #panel-estado {
      margin: 15px;
      padding: 12px;
      background-color: #2a2a2a;
      border-radius: 6px;
      font-size: 1.1em;
      text-align: center;
      width: 90%;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Copiloto Uno</h1>
    <p>Asistente de Navegación Visual (ONNX Runtime)</p>
  </header>

  <div id="container">
    <video id="webcam" autoplay playsinline muted width="640" height="480"></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <div id="panel-estado" aria-live="polite">Cargando modelo YOLOv8 ONNX...</div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const panelEstado = document.getElementById('panel-estado');

    let session;
    const MODEL_PATH = './yolov8n.onnx';

    // Inicializar cámara y modelo
    async function init() {
      try {
        // 1. Acceso a la cámara
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;

        // 2. Cargar sesión ONNX
        panelEstado.innerText = "Cargando archivo yolov8n.onnx...";
        session = await ort.InferenceSession.create(MODEL_PATH, { executionProviders: ['wasm'] });
        
        panelEstado.innerText = "Modelo listo. Detectando entorno...";
        video.addEventListener('loadeddata', detectFrame);
      } catch (err) {
        panelEstado.innerText = "Error de inicialización: " + err.message;
        console.error(err);
      }
    }

    async function detectFrame() {
      if (!session) return;

      // Dibujar fotograma actual en el canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Aquí se procesan los tensores de entrada y salida para YOLOv8
      // ...

      requestAnimationFrame(detectFrame);
    }

    window.onload = init;
  </script>
</body>
</html>
