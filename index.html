<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto Uno - Web</title>
  <!-- Carga de TensorFlow.js y modelo COCO-SSD (equivalente a YOLO) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      margin: 10px 0;
    }
    #contenedor-video {
      position: relative;
      width: 90%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Volteo de espejo para la cámara */
    .espejo {
      transform: scaleX(-1);
    }
    #boton-iniciar {
      margin-top: 15px;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #00e676;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #estado {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>COPILOTO UNO: WEB</h1>
  
  <div id="contenedor-video">
    <video id="webcam" autoplay playsinline class="espejo"></video>
    <canvas id="canvas" class="espejo"></canvas>
  </div>

  <button id="boton-iniciar">INICIAR COPILOTO</button>
  <p id="estado">Presiona el botón para activar cámara y voz.</p>

  <script>
    // Traducción y mapeo de objetos prioritarios según tu código Python
    const OBJETOS_TRADUCIDOS = {
      'person': 'Persona',
      'bicycle': 'Bicicleta',
      'car': 'Coche',
      'bus': 'Autobús',
      'truck': 'Camión',
      'traffic light': 'Semáforo',
      'stop sign': 'Señal',
      'bench': 'Banco',
      'chair': 'Silla',
      'couch': 'Sofá',
      'bed': 'Cama',
      'dining table': 'Mesa'
    };

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const botonIniciar = document.getElementById('boton-iniciar');
    const estadoText = document.getElementById('estado');

    let model = null;
    let ultimoAvisoTiempo = 0;
    const intervaloAviso = 2500; // 2.5 segundos en milisegundos

    // Función de síntesis de voz nativa del navegador
    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Cancela lecturas pendientes
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
      }
      console.log("ALERTA:", texto);
    }

    // Inicializar la cámara trasera en móviles (o la webcam por defecto)
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    }

    // Bucle principal de detección
    async function detectFrame() {
      if (video.readyState === 4) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const anchoPantalla = canvas.width;
        const altoPantalla = canvas.height;
        const areaTotal = anchoPantalla * altoPantalla;

        ctx.clearRect(0, 0, anchoPantalla, altoPantalla);

        // Realizar predicción con COCO-SSD
        const predictions = await model.detect(video);

        predictions.forEach(prediction => {
          const claseIngles = prediction.class;

          if (OBJETOS_TRADUCIDOS[claseIngles] && prediction.score > 0.45) {
            const [x1, y1, width, height] = prediction.bbox;
            const x2 = x1 + width;
            const y2 = y1 + height;

            const centroX = x1 + (width / 2);
            const areaObjeto = width * height;
            const proporcionArea = areaObjeto / areaTotal;

            // Dibujar recuadro verde en pantalla
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 3;
            ctx.strokeRect(x1, y1, width, height);

            if (proporcionArea > 0.05) {
              const tiempoActual = Date.now();

              if (tiempoActual - ultimoAvisoTiempo > intervaloAviso) {
                let posicion = "";
                // Con la inversión en espejo activa, la posición x ajusta el campo visual directo
                if (centroX < anchoPantalla * 0.35) {
                  posicion = "a la izquierda";
                } else if (centroX > anchoPantalla * 0.65) {
                  posicion = "a la derecha";
                } else {
                  posicion = "al frente";
                }

                let distancia = "";
                if (proporcionArea > 0.30) {
                  distancia = "muy cerca";
                } else if (proporcionArea > 0.15) {
                  distancia = "cerca";
                } else {
                  distancia = "a distancia de precaución";
                }

                const nombreObjeto = OBJETOS_TRADUCIDOS[claseIngles];
                const mensaje = `${nombreObjeto} ${posicion}, ${distancia}`;

                // Dibujar texto en pantalla
                ctx.fillStyle = '#00ff00';
                ctx.font = '18px sans-serif';
                ctx.fillText(mensaje, x1, y1 > 20 ? y1 - 10 : 20);

                hablar(mensaje);
                ultimoAvisoTiempo = tiempoActual;
              }
            }
          }
        });
      }
      requestAnimationFrame(detectFrame);
    }

    // Evento de inicio al hacer clic en el botón
    botonIniciar.addEventListener('click', async () => {
      botonIniciar.disabled = true;
      estadoText.innerText = "Cargando modelo de inteligencia artificial...";
      
      try {
        await setupCamera();
        model = await cocoSsd.load();
        estadoText.innerText = "Copiloto Activo - Detectando...";
        botonIniciar.style.display = 'none';
        detectFrame();
      } catch (err) {
        estadoText.innerText = "Error al acceder a la cámara o cargar el modelo: " + err.message;
        botonIniciar.disabled = false;
      }
    });
  </script>
</body>
</html>
