<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto Uno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #00e676;
            margin-bottom: 10px;
            font-size: 24px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <h1>COPILOTO UNO</h1>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button class="btn" onclick="iniciarCopiloto()">ACTIVAR COPILOTO</button>
    <div id="status">Presiona el botón para activar cámara y voz.</div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        let vozActiva = false;

        async function iniciarCopiloto() {
            try {
                // Solicitar acceso a la cámara trasera del móvil
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                }).catch(() => {
                    // Si falla la trasera (ej. en PC), usar cualquier cámara disponible
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                statusDiv.innerText = "Cámara y voz del Copiloto activadas correctamente.";
                
                // Probar motor de voz nativo del móvil
                hablar("Copiloto Uno activado y listo.");
            } catch (err) {
                statusDiv.innerText = "Error al acceder a la cámara: " + err.message;
            }
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Limpiar voz anterior
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.rate = 1.0;
                window.speechSynthesis.speak(mensaje);
            }
        }
    </script>
</body>
</html>
