<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Sonora - Radar de Navegación</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        #btnIniciar {
            background-color: #00e676;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }
        #estado {
            font-size: 22px;
            color: #ffeb3b;
            margin-top: 15px;
            font-weight: bold;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Guía Sonora</h1>
    <button id="btnIniciar">INICIAR RADAR</button>
    
    <video id="video" autoplay playsinline muted></video>
    <div id="estado">Cargando IA...</div>

    <script>
        let model = null;
        let video = document.getElementById('video');
        let estado = document.getElementById('estado');
        let btnIniciar = document.getElementById('btnIniciar');
        
        let audioCtx = null;
        let esActivo = false;
        let ultimoAvisoTiempo = 0;
        let ultimoTextoAvisado = "";
        
        // Historial de masa para detectar aproximación rápida
        let masaAnterior = { izq: 0, centro: 0, der: 0 };

        function decirTexto(texto) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.3; // Fluidez de voz humana acelerada
            window.speechSynthesis.speak(utterance);
        }

        function emitirPitido(frecuencia, duracion) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frecuencia;
            gain.gain.value = 0.2;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (duracion / 1000));
        }

        function emitirPitidoCara() {
            emitirPitido(1400, 70);
            setTimeout(() => emitirPitido(1400, 70), 90);
            setTimeout(() => emitirPitido(1400, 70), 180);
        }

        async function cargarModelo() {
            estado.innerText = "Cargando IA...";
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            estado.innerText = "IA Lista. Pulsa Iniciar.";
        }

        cargarModelo();

        async function IniciarCamara() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(true); };
                });
            } catch (err) {
                estado.innerText = "Error accediendo a la cámara.";
                decirTexto("Error de cámara.");
                return false;
            }
        }

        btnIniciar.addEventListener('click', async () => {
            if (!model) {
                decirTexto("Cargando modelo.");
                return;
            }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            btnIniciar.style.display = 'none';
            estado.innerText = "Iniciando...";

            let camaraLista = await IniciarCamara();
            if (camaraLista) {
                esActivo = true;
                estado.innerText = "Radar Activo";
                decirTexto("Radar activo. Modo flujo visual.");
                procesarRadarContinuo();
            }
        });

        async function procesarRadarContinuo() {
            if (!esActivo) return;

            let ahora = Date.now();
            let anchoVideo = video.videoWidth || 640;
            let altoVideo = video.videoHeight || 480;
            let areaPantalla = anchoVideo * altoVideo;

            let predicciones = await model.detect(video);
            
            let masaActual = { izq: 0, centro: 0, der: 0, arriba: 0 };
            let avisoTexto = "";
            let tipoAlerta = "normal";

            for (let p of predicciones) {
                // Captura amplia de cualquier objeto detectado
                if (p.score < 0.15) continue;

                let x = p.bbox[0];
                let y = p.bbox[1];
                let ancho = p.bbox[2];
                let alto = p.bbox[3];
                let areaObjeto = ancho * alto;
                let porcentaje = (areaObjeto / areaPantalla) * 100;

                let centroX = x + (ancho / 2);
                let centroY = y + (alto / 2);

                // Acumulación de masa visual por zonas
                if (centroX < (anchoVideo * 0.33)) {
                    masaActual.izq += porcentaje;
                } else if (centroX > (anchoVideo * 0.66)) {
                    masaActual.der += porcentaje;
                } else {
                    masaActual.centro += porcentaje;
                    if (centroY < (altoVideo * 0.50)) {
                        masaActual.arriba += porcentaje;
                    }
                }
            }

            // EVALUACIÓN DE APROXIMACIÓN (Aumento de volumen al caminar)
            // 1. Detección alta por acercamiento
            if (masaActual.arriba > 6) {
                tipoAlerta = "cara";
                avisoTexto = "Cara centro";
            }
            // 2. Detección de masa frontal (Sofás / Paredes)
            else if (masaActual.centro > 12) {
                avisoTexto = "Obstáculo centro";
            }
            // 3. Flujo periférico lateral (Izquierda / Derecha)
            else if (masaActual.izq > 10) {
                avisoTexto = "Peligro izquierda";
            } else if (masaActual.der > 10) {
                avisoTexto = "Peligro derecha";
            }

            // Emisión de avisos
            if (ahora - ultimoAvisoTiempo > 800) {
                if (avisoTexto !== "") {
                    if (tipoAlerta === "cara") {
                        emitirPitidoCara();
                    } else {
                        emitirPitido(900, 150);
                    }

                    if (avisoTexto !== ultimoTextoAvisado) {
                        decirTexto(avisoTexto);
                        ultimoTextoAvisado = avisoTexto;
                    }
                    estado.innerText = "Alerta: " + avisoTexto;
                    ultimoAvisoTiempo = ahora;
                } else {
                    ultimoTextoAvisado = "";
                    estado.innerText = "Vía libre";
                }
            }

            // Guardar lecturas
            masaAnterior = masaActual;

            requestAnimationFrame(procesarRadarContinuo);
        }
    </script>
</body>
</html>
