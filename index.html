!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto Uno - Web</title>
  <!-- Motores de TensorFlow.js y COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.2rem;
      margin: 15px 0 5px 0;
    }
    #contenedor-visor {
      position: relative;
      width: 95%;
      max-width: 640px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #boton-iniciar {
      margin: 15px 0;
      padding: 15px 25px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #00c853;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #panel-estado {
      width: 90%;
      max-width: 640px;
      padding: 10px;
      background: #1e1e1e;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #00e676;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>COPILOTO UNO: WEB</h1>
  
  <div id="contenedor-visor">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="boton-iniciar">INICIAR DETECCIÓN</button>
  <div id="panel-estado">Estado: Presiona el botón para cargar la IA.</div>

  <script>
    const OBJETOS_TRADUCIDOS = {
      'person': 'Persona',
      'bicycle': 'Bicicleta',
      'car': 'Coche',
      'bus': 'Autobús',
      'truck': 'Camión',
      'traffic light': 'Semáforo',
      'stop sign': 'Señal',
      'bench': 'Banco',
      'chair': 'Silla',
      'couch': 'Sofá',
      'bed': 'Cama',
      'dining table': 'Mesa'
    };

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const botonIniciar = document.getElementById('boton-iniciar');
    const panelEstado = document.getElementById('panel-estado');

    let model = null;
    let ultimoAvisoTiempo = 0;
    const intervaloAviso = 2500;

    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    async function iniciarCamara() {
      const constraints = {
        video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadeddata = () => {
          resolve(true);
        };
      });
    }

    async function bucleDeteccion() {
      if (video.readyState >= 2 && model) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const anchoPantalla = canvas.width;
        const altoPantalla = canvas.height;
        const areaTotal = anchoPantalla * altoPantalla;

        ctx.clearRect(0, 0, anchoPantalla, altoPantalla);

        // Realizar predicción directa sobre el elemento de vídeo
        const predictions = await model.detect(video, 10, 0.35);

        let detectadosEnFotograma = 0;

        predictions.forEach(prediction => {
          const claseIngles = prediction.class;

          if (OBJETOS_TRADUCIDOS[claseIngles]) {
            detectadosEnFotograma++;
            const [x1, y1, width, height] = prediction.bbox;
            const centroX = x1 + (width / 2);
            const areaObjeto = width * height;
            const proporcionArea = areaObjeto / areaTotal;

            // Dibujar rectángulo de seguimiento
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 4;
            ctx.strokeRect(x1, y1, width, height);

            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 20px Arial';
            ctx.fillText(OBJETOS_TRADUCIDOS[claseIngles], x1, y1 > 25 ? y1 - 10 : 25);

            if (proporcionArea > 0.04) {
              const tiempoActual = Date.now();

              if (tiempoActual - ultimoAvisoTiempo > intervaloAviso) {
                let posicion = "";
                if (centroX < anchoPantalla * 0.35) {
                  posicion = "a la izquierda";
                } else if (centroX > anchoPantalla * 0.65) {
                  posicion = "a la derecha";
                } else {
                  posicion = "al frente";
                }

                let distancia = "";
                if (proporcionArea > 0.25) {
                  distancia = "muy cerca";
                } else if (proporcionArea > 0.12) {
                  distancia = "cerca";
                } else {
                  distancia = "a distancia de precaución";
                }

                const nombreObjeto = OBJETOS_TRADUCIDOS[claseIngles];
                const mensaje = `${nombreObjeto} ${posicion}, ${distancia}`;

                panelEstado.innerText = "Aviso: " + mensaje;
                hablar(mensaje);
                ultimoAvisoTiempo = tiempoActual;
              }
            }
          }
        });

        if (detectadosEnFotograma === 0) {
          panelEstado.innerText = "Estado: Analizando vídeo (Buscando objetos...)";
        }
      }
      requestAnimationFrame(bucleDeteccion);
    }

    botonIniciar.addEventListener('click', async () => {
      botonIniciar.disabled = true;
      panelEstado.innerText = "Estado: Activando cámara...";

      try {
        await iniciarCamara();
        panelEstado.innerText = "Estado: Descargando red neuronal COCO-SSD...";
        
        // Carga explícita del modelo ligero para móviles
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        
        panelEstado.innerText = "Estado: ¡Copiloto listo y detectando!";
        botonIniciar.style.display = 'none';
        
        bucleDeteccion();
      } catch (err) {
        panelEstado.innerText = "Error: " + err.message;
        botonIniciar.disabled = false;
      }
    });
  </script>
</body>
</html>
