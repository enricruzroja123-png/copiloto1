<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto Uno - Detección ONNX</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 15px;
      text-align: center;
      background-color: #1f1f1f;
      width: 100%;
    }
    #container {
      position: relative;
      margin-top: 10px;
    }
    video, canvas {
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #panel-estado {
      margin: 15px;
      padding: 12px;
      background-color: #2a2a2a;
      border-radius: 6px;
      font-size: 1.1em;
      text-align: center;
      width: 90%;
      max-width: 600px;
    }
  </style>
  <!-- Carga diferida garantizada de ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
</head>
<body>

  <header>
    <h1>Copiloto Uno</h1>
    <p>Asistente de Navegación Visual (YOLOv8 ONNX)</p>
  </header>

  <div id="container">
    <video id="webcam" autoplay playsinline muted width="640" height="480"></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <div id="panel-estado" aria-live="polite">Iniciando aplicación...</div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const panelEstado = document.getElementById('panel-estado');

    let session;
    const MODEL_PATH = './yolov8n.onnx';

    async function init() {
      // 1. Verificar si la librería ort está disponible globalmente
      if (typeof ort === 'undefined') {
        panelEstado.innerText = "Error: No se pudo cargar la librería ONNX Runtime. Revisa tu conexión a internet.";
        console.error("ONNX Runtime Web (ort) no se encuentra definido.");
        return;
      }

      try {
        panelEstado.innerText = "Solicitando acceso a la cámara...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;

        panelEstado.innerText = "Cargando archivo yolov8n.onnx...";
        
        // Configurar ruta de WebAssembly para evitar bloqueos
        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';

        // Crear la sesión de inferencia
        session = await ort.InferenceSession.create(MODEL_PATH, { executionProviders: ['wasm'] });
        
        panelEstado.innerText = "Modelo ONNX cargado correctamente. Listo para procesar.";
      } catch (err) {
        panelEstado.innerText = "Error al iniciar: " + err.message;
        console.error("Detalle del error:", err);
      }
    }

    // Esperar a que toda la página y los scripts de la CDN hayan cargado
    window.addEventListener('load', init);
  </script>
</body>
</html>
