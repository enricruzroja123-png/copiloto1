<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto Uno - Motor Python a Web</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #00e676; font-size: 22px; margin-bottom: 5px; }
        #video-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #00e676; }
        video { width: 100%; height: auto; display: block; }
        .btn { background-color: #00e676; color: #000; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; margin-top: 15px; cursor: pointer; border: none; width: 100%; max-width: 300px; }
        #status { margin-top: 12px; font-size: 15px; color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

    <h1>COPILOTO UNO</h1>
    
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <button class="btn" onclick="iniciarCopiloto()">ACTIVAR COPILOTO</button>
    <div id="status">Presiona para activar...</div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        let modeloIA = null;
        let detectando = false;
        
        // Variables calcadas de nuestro script de Python
        let ultimoAvisoTiempo = 0;
        const intervaloAviso = 2.5 * 1000; // 2.5 segundos entre avisos
        let contadorFotogramas = 0;

        // Mismo diccionario de objetos prioritarios
        const OBJETOS_PRIORITARIOS = {
            "person": "Persona", "bicycle": "Bicicleta", "car": "Coche", "bus": "Autobús", 
            "truck": "Camión", "traffic light": "Semáforo", "stop sign": "Señal", "bench": "Banco", 
            "chair": "Silla", "couch": "Sofá", "bed": "Cama", "dining table": "Mesa", "potted plant": "Maceta"
        };

        async function iniciarCopiloto() {
            statusDiv.innerText = "Iniciando cámara...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                
                video.srcObject = stream;

                video.onloadeddata = async () => {
                    statusDiv.innerText = "Cargando modelo...";
                    modeloIA = await cocoSsd.load({ base: 'mobilenet_v2' });
                    statusDiv.innerText = "¡Copiloto Activo!";
                    hablar("Copiloto activo.");
                    detectando = true;
                    requestAnimationFrame(procesarBuclePython);
                };
            } catch (err) {
                statusDiv.innerText = "Error de cámara: " + err.message;
            }
        }

        async function procesarBuclePython() {
            if (!detectando) return;

            contadorFotogramas++;

            // Mismo truco que en Python: Procesar solo 1 de cada 3 fotogramas (contadorFotogramas % 3 == 0)
            if (contadorFotogramas % 3 === 0) {
                const predicciones = await modeloIA.detect(video, 5, 0.40);
                const tiempoActual = Date.now();

                const anchoPantalla = video.videoWidth || 640;
                const altoPantalla = video.videoHeight || 480;
                const areaPantalla = anchoPantalla * altoPantalla;

                for (let pred of predicciones) {
                    if (OBJETOS_PRIORITARIOS[pred.class]) {
                        const [x, y, w, h] = pred.bbox;
                        const cx = x + (w / 2);
                        const areaObjeto = w * h;
                        const proporcionArea = areaObjeto / areaPantalla;

                        // Filtro de tamaño mínimo (5% de la pantalla)
                        if (proporcionArea > 0.05) {
                            if (tiempoActual - ultimoAvisoTiempo > intervaloAviso) {
                                // Cálculo de posición igual que en Python
                                let posicion = "al frente";
                                if (cx < anchoPantalla * 0.35) posicion = "a la izquierda";
                                else if (cx > anchoPantalla * 0.65) posicion = "a la derecha";

                                // Cálculo de distancia exacto a Python por área
                                let distancia = "a distancia de precaución";
                                if (proporcionArea > 0.30) distancia = "muy cerca";
                                else if (proporcionArea > 0.15) distancia = "cerca";

                                const nombreObjeto = OBJETOS_PRIORITARIOS[pred.class];
                                const mensaje = `${nombreObjeto} ${posicion}, ${distancia}`;
                                
                                statusDiv.innerText = "ALERTA: " + mensaje;
                                hablar(mensaje);
                                ultimoAvisoTiempo = tiempoActual;
                                break; // Avisar del objeto principal y continuar
                            }
                        }
                    }
                }
            }

            requestAnimationFrame(procesarBuclePython);
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.rate = 1.0;
                window.speechSynthesis.speak(mensaje);
            }
        }
    </script>
</body>
</html>
