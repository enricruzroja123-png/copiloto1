<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Sonora de Ruta - Calibrado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.4rem; text-align: center; color: #38bdf8; margin-bottom: 20px; }
        
        /* Ocultamos el vídeo visual, dejamos que procese en segundo plano */
        #video { display: none; }

        .btn {
            border: none;
            padding: 22px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            color: #ffffff;
            width: 100%;
            max-width: 340px;
            margin-bottom: 15px;
        }
        .btn-activar { background-color: #16a34a; }
        .btn-dbr { background-color: #0284c7; }
        
        #estado { margin-top: 15px; font-size: 1.1rem; color: #fbbf24; text-align: center; }
        #log { margin-top: 10px; font-size: 0.9rem; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>

    <h1>🐾 Guía Sonora (Alta Sensibilidad)</h1>

    <video id="video" autoplay playsinline muted></video>

    <button class="btn btn-activar" onclick="iniciarGuia()">📷 INICIAR RADAR MEJORADO</button>
    <button class="btn btn-dbr" onclick="activarMicrofonoDBR()">🎙️ REGISTRO DBR (Voz)</button>

    <div id="estado">Pulsa para probar la detección mejorada</div>
    <div id="log">Esperando...</div>

    <script>
        const estado = document.getElementById('estado');
        const log = document.getElementById('log');
        const video = document.getElementById('video');

        let modeloAI = null;
        let estaHablando = false;
        let ultimoAvisoT = 0;
        let contextAudio = null;
        let oscilador = null;

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function initAudio() {
            if (!contextAudio) {
                contextAudio = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function tocarPitido(frecuencia, duracion, repeticiones) {
            initAudio();
            if (oscilador) oscilador.stop();

            oscilador = contextAudio.createOscillator();
            const gainNode = contextAudio.createGain();

            oscilador.connect(gainNode);
            gainNode.connect(contextAudio.destination);

            oscilador.type = 'sine';
            oscilador.frequency.value = frecuencia;
            gainNode.gain.value = 0.15;

            oscilador.start();
            
            let count = 0;
            const interval = setInterval(() => {
                gainNode.gain.value = 0.15;
                setTimeout(() => { gainNode.gain.value = 0; }, duracion / 2);
                count++;
                if (count >= repeticiones) {
                    clearInterval(interval);
                    setTimeout(() => oscilador.stop(), duracion);
                }
            }, duracion);
        }

        function hablar(texto) {
            const ahora = Date.now();
            // Espaciado entre avisos de voz: 2.5 segundos para responder más rápido
            if ('speechSynthesis' in window && !estaHablando && (ahora - ultimoAvisoT > 2500)) {
                estaHablando = true;
                ultimoAvisoT = ahora;
                window.speechSynthesis.cancel();
                
                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = 'es-ES';
                mensaje.rate = 1.1; // Un poco más rápido para responder al instante en calle
                mensaje.onend = () => { estaHablando = false; };
                mensaje.onerror = () => { estaHablando = false; };
                
                window.speechSynthesis.speak(mensaje);
            }
        }

        async function iniciarGuia() {
            estado.innerText = "Cargando modelo de alta sensibilidad...";
            initAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                video.srcObject = stream;

                // Cargamos el modelo lite pero con mayor frecuencia de escaneo
                modeloAI = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                
                estado.innerText = "Radar Calibrado Activo";
                hablar("Radar calibrado activado. Sensibilidad aumentada.");

                video.onloadedmetadata = () => {
                    setInterval(procesarEscaneo, 300); // Escaneo constante cada 300 milisegundos
                };
            } catch (err) {
                estado.innerText = "Error de cámara o permisos";
                hablar("Error al iniciar la cámara.");
            }
        }

        async function procesarEscaneo() {
            if (modeloAI && video.readyState === 4) {
                // Escaneamos pidiendo hasta 5 objetos en simultáneo
                const predicciones = await modeloAI.detect(video, 5, 0.25); // Sensibilidad bajada a 0.25 (25%)
                
                let objetoCercano = null;
                let distanciaMinima = 99;

                const anchoVideo = video.videoWidth || 640;
                const altoVideo = video.videoHeight || 480;
                const tercioW = anchoVideo / 3;

                predicciones.forEach(pred => {
                    const [x, y, width, height] = pred.bbox;
                    const centroX = x + (width / 2);

                    // Determinación precisa del sector
                    let sector = "centro";
                    if (centroX < tercioW) sector = "izquierda";
                    else if (centroX > tercioW * 2) sector = "derecha";

                    // Cálculo aproximado de distancia por ocupación de altura
                    const proporcion = height / altoVideo;
                    const metros = Math.max(1, Math.round(12 * (1 - proporcion)));

                    if (metros < distanciaMinima) {
                        distanciaMinima = metros;
                        objetoCercano = {
                            nombre: traducir(pred.class),
                            sector: sector,
                            metros: metros
                        };
                    }
                });

                if (objetoCercano) {
                    log.innerText = `Detectado: ${objetoCercano.nombre} (${objetoCercano.sector}) a ~${objetoCercano.metros}m`;
                    
                    if (objetoCercano.metros <= 4) {
                        tocarPitido(800, 120, 2); // Pitido de peligro
                    }

                    hablar(`${objetoCercano.nombre}, ${objetoCercano.sector}.`);
                } else {
                    log.innerText = "Camino libre (Buscando...)";
                }
            }
        }

        function traducir(clase) {
            switch(clase) {
                case 'person': return 'Peatón';
                case 'car': return 'Coche';
                case 'bus': return 'Autobús';
                case 'truck': return 'Camión';
                case 'dog': return 'Perro';
                case 'cat': return 'Animal';
                case 'bicycle': return 'Bicicleta';
                case 'motorcycle': return 'Moto';
                default: return 'Obstáculo';
            }
        }

        function activarMicrofonoDBR() {
            if (!Recognition) return;
            hablar("Diga el trámite para DBR.");
            const recon = new Recognition();
            recon.lang = 'es-ES';
            recon.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                hablar("Registro guardado: " + cmd);
            };
            recon.start();
        }
    </script>

</body>
</html>
